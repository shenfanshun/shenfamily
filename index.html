<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的相簿網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 流水號排版 (Masonry / Columns) 的基本微調 */
        .masonry-grid {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" onclick="showPage('home')" class="text-xl font-bold text-gray-900 tracking-wider">📷 我的相簿空間</a>
            <button onclick="showPage('home')" id="back-btn" class="hidden text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-full transition">
                ← 返回首頁
            </button>
        </div>
    </nav>

    <main id="page-home" class="max-w-6xl mx-auto px-4 py-10">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-950 mb-3">歡迎來到我的相片集</h1>
            <p class="text-gray-500">請選擇下方的主題系列觀看照片</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div onclick="showPage('album-a')" class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white text-4xl">🌌</div>
                <div class="p-5">
                    <h3 class="font-bold text-lg group-hover:text-indigo-600 transition">照片集 A：幻彩星空</h3>
                    <p class="text-sm text-gray-400 mt-1">點擊進入觀賞流體與星空創作</p>
                </div>
            </div>

            <div onclick="showPage('album-b')" class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center text-white text-4xl">🌿</div>
                <div class="p-5">
                    <h3 class="font-bold text-lg group-hover:text-emerald-600 transition">照片集 B：自然微光</h3>
                    <p class="text-sm text-gray-400 mt-1">捕捉森林與日光交織的瞬間</p>
                </div>
            </div>

            <div onclick="showPage('album-c')" class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white text-4xl">🧱</div>
                <div class="p-5">
                    <h3 class="font-bold text-lg group-hover:text-amber-600 transition">照片集 C：城市幾何</h3>
                    <p class="text-sm text-gray-400 mt-1">街頭建築與光影的結構美學</p>
                </div>
            </div>

            <div onclick="showPage('album-d')" class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white text-4xl">☕</div>
                <div class="p-5">
                    <h3 class="font-bold text-lg group-hover:text-rose-600 transition">照片集 D：日常一隅</h3>
                    <p class="text-sm text-gray-400 mt-1">角落裡靜止的溫暖生活碎片</p>
                </div>
            </div>

            <div onclick="showPage('album-e')" class="group cursor-pointer bg-white rounded-2xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                <div class="h-48 bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center text-white text-4xl">🌊</div>
                <div class="p-5">
                    <h3 class="font-bold text-lg group-hover:text-blue-600 transition">照片集 E：深藍極致</h3>
                    <p class="text-sm text-gray-400 mt-1">關於海洋與遠方地平線的紀錄</p>
                </div>
            </div>
        </div>
    </main>

    <section id="page-album-a" class="hidden max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 border-l-4 border-indigo-500 pl-3">照片集 A：幻彩星空</h2>
        <div class="masonry-grid">
            <div class="masonry-item"><img src="https://picsum.photos/600/800?random=1" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/400?random=2" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/700?random=3" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/500?random=4" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
        </div>
    </section>

    <section id="page-album-b" class="hidden max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 border-l-4 border-emerald-500 pl-3">照片集 B：自然微光</h2>
        <div class="masonry-grid">
            <div class="masonry-item"><img src="https://picsum.photos/600/500?random=5" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/900?random=6" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/400?random=7" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
        </div>
    </section>

    <section id="page-album-c" class="hidden max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 border-l-4 border-amber-500 pl-3">照片集 C：城市幾何</h2>
        <div class="masonry-grid">
            <div class="masonry-item"><img src="https://picsum.photos/600/400?random=8" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/600?random=9" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/800?random=10" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
        </div>
    </section>

    <section id="page-album-d" class="hidden max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 border-l-4 border-rose-500 pl-3">照片集 D：日常一隅</h2>
        <div class="masonry-grid">
            <div class="masonry-item"><img src="https://picsum.photos/600/700?random=11" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/400?random=12" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
        </div>
    </section>

    <section id="page-album-e" class="hidden max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6 text-gray-900 border-l-4 border-blue-500 pl-3">照片集 E：深藍極致</h2>
        <div class="masonry-grid">
            <div class="masonry-item"><img src="https://picsum.photos/600/500?random=13" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
            <div class="masonry-item"><img src="https://picsum.photos/600/500?random=14" alt="照片" class="w-full rounded-xl shadow-sm hover:opacity-90 transition cursor-zoom-in" onclick="openLightbox(this.src)"></div>
        </div>
    </section>

    <div id="lightbox" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-white text-3xl font-light hover:text-gray-300">&times;</button>
        <img id="lightbox-img" src="" alt="放大照片" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl transform scale-95 transition-transform duration-300">
    </div>

    <script>
        // 1. 分頁切換控制邏輯
        function showPage(pageId) {
            // 隱藏所有分頁區塊
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-album-a').classList.add('hidden');
            document.getElementById('page-album-b').classList.add('hidden');
            document.getElementById('page-album-c').classList.add('hidden');
            document.getElementById('page-album-d').classList.add('hidden');
            document.getElementById('page-album-e').classList.add('hidden');

            // 顯示目標分頁
            const targetPage = document.getElementById(`page-${pageId}`);
            if(targetPage) {
                targetPage.classList.remove('hidden');
            }

            // 控制「返回首頁」按鈕是否顯示
            const backBtn = document.getElementById('back-btn');
            if (pageId === 'home') {
                backBtn.classList.add('hidden');
            } else {
                backBtn.classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' }); // 切換時自動滾動回頂部
            }
        }

        // 2. 照片放大燈箱 (Lightbox) 邏輯
        function openLightbox(imgSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.src = imgSrc;
            lightbox.classList.remove('hidden');
            
            // 讓放大動畫更平滑
            setTimeout(() => {
                lightboxImg.classList.remove('scale-95');
                lightboxImg.classList.add('scale-100');
            }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            lightboxImg.classList.remove('scale-100');
            lightboxImg.classList.add('scale-95');
            
            setTimeout(() => {
                lightbox.classList.add('hidden');
            }, 200);
        }
    </script>
</body>
</html>
